<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Royal DC Hotel - Admin Test</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #111;
        }

        .login-box {
            width: 400px;
            max-width: 90%;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #c9a227;
            color: #111;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 7px;
            background: #f3f3f3;
            white-space: pre-wrap;
            word-break: break-word;
            display: none;
        }

        .success {
            border: 1px solid #28a745;
        }

        .error {
            border: 1px solid #dc3545;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>Royal DC Hotel</h1>

        <div class="subtitle">
            Admin Login Test
        </div>

        <form id="loginForm">

            <label for="email">
                Admin Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter admin email"
                required
            >

            <label for="password">
                Admin Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter admin password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <div id="result"></div>

    </div>

    <script src="/admin-test.js"></script>

</body>
</html>
