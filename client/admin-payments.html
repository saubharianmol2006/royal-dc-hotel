<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Payments Management | Royal DC Hotel</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f5;
            color: #111;
        }

        .admin-layout {
            display: flex;
            min-height: 100vh;
        }

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            width: 270px;
            background: #0b0b0b;
            color: #fff;
            min-height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            padding: 32px 20px;
        }

        .brand {
            padding: 0 12px 30px;
            border-bottom: 1px solid #292929;
        }

        .brand h1 {
            color: #d4af37;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 27px;
            margin-bottom: 7px;
        }

        .brand p {
            color: #aaa;
            font-size: 12px;
            letter-spacing: 2px;
        }

        .sidebar-nav {
            margin-top: 28px;
        }

        .sidebar-nav a {
            display: block;
            text-decoration: none;
            color: #ddd;
            padding: 15px 16px;
            border-radius: 8px;
            margin-bottom: 6px;
            font-size: 15px;
            transition: 0.2s;
        }

        .sidebar-nav a:hover {
            background: #1c1c1c;
            color: #d4af37;
        }

        .sidebar-nav a.active {
            background: #222;
            color: #d4af37;
        }

        /* =========================
           MAIN CONTENT
        ========================= */

        .main-content {
            margin-left: 270px;
            width: calc(100% - 270px);
            min-height: 100vh;
        }

        .topbar {
            height: 82px;
            background: #fff;
            border-bottom: 1px solid #e2e2e2;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 0 38px;
            gap: 20px;
        }

        .admin-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .admin-name {
            font-weight: 600;
            color: #222;
        }

        .logout-btn {
            border: 1px solid #222;
            background: #111;
            color: #fff;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .logout-btn:hover {
            background: #d4af37;
            border-color: #d4af37;
            color: #111;
        }

        .page-content {
            padding: 34px;
        }

        .page-header {
            margin-bottom: 28px;
        }

        .page-header h2 {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 34px;
            margin-bottom: 8px;
        }

        .page-header p {
            color: #777;
            font-size: 16px;
        }

        /* =========================
           FILTERS
        ========================= */

        .filter-box {
            background: #fff;
            border: 1px solid #e3e3e3;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 26px;
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }

        .filter-box input,
        .filter-box select {
            height: 46px;
            border: 1px solid #d7d7d7;
            border-radius: 7px;
            padding: 0 14px;
            font-size: 14px;
            background: #fff;
            outline: none;
        }

        .filter-box input {
            width: 300px;
        }

        .filter-box select {
            width: 190px;
        }

        .filter-box input:focus,
        .filter-box select:focus {
            border-color: #d4af37;
        }

        /* =========================
           PAYMENT CARDS
        ========================= */

        #paymentsContainer {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .payment-card {
            background: #fff;
            border: 1px solid #e1e1e1;
            border-radius: 14px;
            padding: 25px;
        }

        .payment-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            padding-bottom: 18px;
            border-bottom: 1px solid #ededed;
        }

        .payment-booking-id {
            color: #b28b00;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .payment-guest {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .payment-contact {
            color: #777;
            font-size: 14px;
        }

        .status-area {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .status-badge {
            padding: 8px 13px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .status-paid {
            background: #e4f7eb;
            color: #08752d;
        }

        .status-pending {
            background: #fff2d5;
            color: #9a6700;
        }

        .status-failed {
            background: #ffe5e5;
            color: #b42318;
        }

        .status-refunded {
            background: #e8e8ff;
            color: #4b4bb7;
        }

        .payment-details {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-top: 20px;
        }

        .detail-box {
            border: 1px solid #ededed;
            background: #fafafa;
            border-radius: 9px;
            padding: 16px;
            min-height: 85px;
        }

        .detail-label {
            color: #888;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 8px;
        }

        .detail-value {
            font-size: 15px;
            font-weight: 600;
            color: #111;
            word-break: break-word;
        }

        .amount-section {
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px solid #ededed;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 10px;
        }

        .amount-label {
            color: #777;
            font-size: 14px;
        }

        .amount-value {
            font-size: 26px;
            font-weight: 700;
        }

        .empty-state {
            background: #fff;
            border: 1px solid #e2e2e2;
            border-radius: 14px;
            padding: 60px 20px;
            text-align: center;
            color: #777;
        }

        .empty-state h3 {
            color: #222;
            margin-bottom: 8px;
        }

        .loading {
            background: #fff;
            border: 1px solid #e2e2e2;
            border-radius: 14px;
            padding: 50px;
            text-align: center;
            color: #777;
        }

        .error-message {
            background: #fff0f0;
            border: 1px solid #f0b4b4;
            color: #a40000;
            border-radius: 10px;
            padding: 18px;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 1100px) {
            .payment-details {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 800px) {
            .sidebar {
                width: 220px;
            }

            .main-content {
                margin-left: 220px;
                width: calc(100% - 220px);
            }

            .payment-header {
                flex-direction: column;
            }

            .status-area {
                justify-content: flex-start;
            }

            .filter-box input,
            .filter-box select {
                width: 100%;
            }
        }

        @media (max-width: 600px) {
            .sidebar {
                position: relative;
                width: 100%;
                min-height: auto;
            }

            .admin-layout {
                display: block;
            }

            .main-content {
                margin-left: 0;
                width: 100%;
            }

            .topbar {
                padding: 0 20px;
            }

            .page-content {
                padding: 20px;
            }

            .payment-details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="admin-layout">

    <!-- =========================
         SIDEBAR
    ========================== -->

    <aside class="sidebar">

        <div class="brand">
            <h1>Royal DC Hotel</h1>
            <p>ADMIN PANEL</p>
        </div>

        <nav class="sidebar-nav">

            <a href="/admin-dashboard.html">
                Dashboard
            </a>

            <a href="/admin-rooms.html">
                Rooms
            </a>

            <a href="/admin-bookings.html">
                Bookings
            </a>

            <a
                href="/admin-payments.html"
                class="active"
            >
                Payments
            </a>

        </nav>

    </aside>


    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main class="main-content">

        <header class="topbar">

            <div class="admin-info">

                <span
                    class="admin-name"
                    id="adminName"
                >
                    Admin
                </span>

                <button
                    class="logout-btn"
                    id="logoutBtn"
                    type="button"
                >
                    Logout
                </button>

            </div>

        </header>


        <section class="page-content">

            <div class="page-header">

                <h2>
                    Payment Management
                </h2>

                <p>
                    View and manage all hotel payment records.
                </p>

            </div>


            <!-- =========================
                 FILTERS
            ========================== -->

            <div class="filter-box">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search booking ID or guest..."
                >

                <select id="paymentStatusFilter">

                    <option value="all">
                        All Payment Status
                    </option>

                    <option value="pending">
                        Pending
                    </option>

                    <option value="paid">
                        Paid
                    </option>

                    <option value="failed">
                        Failed
                    </option>

                    <option value="refunded">
                        Refunded
                    </option>

                </select>

                <select id="paymentMethodFilter">

                    <option value="all">
                        All Payment Methods
                    </option>

                    <option value="razorpay">
                        Razorpay
                    </option>

                    <option value="cash">
                        Cash
                    </option>

                    <option value="other">
                        Other
                    </option>

                </select>

            </div>


            <!-- =========================
                 PAYMENTS
            ========================== -->

            <div id="paymentsContainer">

                <div class="loading">
                    Loading payments...
                </div>

            </div>

        </section>

    </main>

</div>


<script src="/admin-payments.js"></script>

</body>
</html>
