<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Booking Management | Royal DC Hotel</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", sans-serif;
            background: #f5f5f5;
            color: #171717;
        }

        .layout {
            min-height: 100vh;
            display: flex;
        }

        /* SIDEBAR */

        .sidebar {
            width: 250px;
            background: #0b0b0b;
            color: #ffffff;
            padding: 28px 18px;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
        }

        .brand {
            padding: 0 12px 30px;
            border-bottom: 1px solid #2b2b2b;
        }

        .brand-name {
            font-family: "Playfair Display", serif;
            font-size: 24px;
            color: #d4af37;
        }

        .brand-subtitle {
            margin-top: 5px;
            font-size: 11px;
            color: #999;
            letter-spacing: 1.5px;
        }

        .nav {
            margin-top: 28px;
        }

        .nav a {
            display: block;
            padding: 14px 15px;
            margin-bottom: 7px;
            border-radius: 8px;
            color: #cfcfcf;
            text-decoration: none;
            font-size: 14px;
            transition: 0.2s;
        }

        .nav a:hover,
        .nav a.active {
            background: #1d1d1d;
            color: #d4af37;
        }

        /* MAIN */

        .main {
            margin-left: 250px;
            width: calc(100% - 250px);
        }

        .topbar {
            height: 76px;
            background: #ffffff;
            border-bottom: 1px solid #e5e5e5;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 35px;
        }

        .page-title {
            font-family: "Playfair Display", serif;
            font-size: 27px;
        }

        .admin-area {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .admin-name {
            font-size: 14px;
            font-weight: 600;
        }

        .logout-btn {
            border: 1px solid #ddd;
            background: #fff;
            padding: 9px 15px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 13px;
        }

        .logout-btn:hover {
            border-color: #d4af37;
            color: #a8871d;
        }

        /* CONTENT */

        .content {
            padding: 32px;
        }

        .intro {
            margin-bottom: 25px;
        }

        .intro h1 {
            font-family: "Playfair Display", serif;
            font-size: 30px;
            margin-bottom: 7px;
        }

        .intro p {
            color: #777;
            font-size: 14px;
        }

        /* FILTERS */

        .filters {
            background: #ffffff;
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 25px;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .filter-input,
        .filter-select {
            height: 42px;
            border: 1px solid #ddd;
            border-radius: 7px;
            padding: 0 12px;
            font-family: inherit;
            font-size: 13px;
            background: #fff;
        }

        .filter-input {
            min-width: 250px;
        }

        .filter-select {
            min-width: 170px;
        }

        /* BOOKING CARDS */

        .bookings-container {
            display: grid;
            gap: 18px;
        }

        .booking-card {
            background: #ffffff;
            border: 1px solid #e3e3e3;
            border-radius: 13px;
            padding: 24px;
        }

        .booking-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            padding-bottom: 18px;
            border-bottom: 1px solid #eeeeee;
        }

        .booking-id {
            color: #9a7b18;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.7px;
            margin-bottom: 7px;
        }

        .guest-name {
            font-size: 20px;
            font-weight: 700;
        }

        .guest-email {
            margin-top: 5px;
            color: #777;
            font-size: 13px;
        }

        .status-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .status {
            display: inline-block;
            padding: 7px 11px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .status.pending {
            background: #fff4d6;
            color: #9a6d00;
        }

        .status.confirmed {
            background: #e5f7eb;
            color: #18763a;
        }

        .status.checked-in {
            background: #e5efff;
            color: #235ea8;
        }

        .status.checked-out {
            background: #eeeeee;
            color: #555;
        }

        .status.cancelled {
            background: #ffe7e7;
            color: #b42323;
        }

        .status.paid {
            background: #e5f7eb;
            color: #18763a;
        }

        .status.payment-pending {
            background: #fff4d6;
            color: #9a6d00;
        }

        .status.failed {
            background: #ffe7e7;
            color: #b42323;
        }

        .booking-details {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-top: 20px;
        }

        .detail-box {
            background: #fafafa;
            border: 1px solid #eeeeee;
            border-radius: 9px;
            padding: 14px;
        }

        .detail-label {
            color: #888;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.7px;
            margin-bottom: 7px;
        }

        .detail-value {
            font-size: 14px;
            font-weight: 600;
        }

        .booking-footer {
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px solid #eeeeee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .special-request {
            color: #666;
            font-size: 13px;
        }

        .special-request strong {
            color: #222;
        }

        .amount {
            font-size: 22px;
            font-weight: 700;
        }

        .amount span {
            font-size: 12px;
            color: #888;
            font-weight: 400;
        }

        .loading,
        .empty,
        .error {
            background: #ffffff;
            border: 1px solid #e3e3e3;
            border-radius: 12px;
            padding: 50px;
            text-align: center;
            color: #777;
        }

        .error {
            color: #b42323;
        }

        /* RESPONSIVE */

        @media (max-width: 1000px) {
            .booking-details {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 750px) {
            .sidebar {
                width: 210px;
            }

            .main {
                margin-left: 210px;
                width: calc(100% - 210px);
            }

            .topbar {
                padding: 0 20px;
            }

            .content {
                padding: 20px;
            }

            .booking-header {
                flex-direction: column;
            }

            .status-group {
                justify-content: flex-start;
            }
        }

        @media (max-width: 600px) {
            .sidebar {
                position: static;
                width: 100%;
                min-height: auto;
            }

            .layout {
                display: block;
            }

            .main {
                margin-left: 0;
                width: 100%;
            }

            .booking-details {
                grid-template-columns: 1fr;
            }

            .booking-footer {
                flex-direction: column;
                align-items: flex-start;
            }

            .topbar {
                height: auto;
                padding: 18px;
                gap: 15px;
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

<div class="layout">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="brand">
            <div class="brand-name">
                Royal DC Hotel
            </div>

            <div class="brand-subtitle">
                ADMIN PANEL
            </div>
        </div>

        <nav class="nav">

            <a href="/admin-dashboard.html">
                Dashboard
            </a>

            <a href="/admin-rooms.html">
                Rooms
            </a>

            <a
                href="/admin-bookings.html"
                class="active"
            >
                Bookings
            </a>

            <a
                href="#"
                id="paymentsLink"
            >
                Payments
            </a>

        </nav>

    </aside>


    <!-- MAIN -->

    <main class="main">

        <header class="topbar">

            <div class="page-title">
                Booking Management
            </div>

            <div class="admin-area">

                <div
                    class="admin-name"
                    id="adminName"
                >
                    Admin
                </div>

                <button
                    type="button"
                    class="logout-btn"
                    id="logoutBtn"
                >
                    Logout
                </button>

            </div>

        </header>


        <section class="content">

            <div class="intro">

                <h1>
                    Hotel Bookings
                </h1>

                <p>
                    View and manage all guest reservations.
                </p>

            </div>


            <!-- FILTERS -->

            <div class="filters">

                <input
                    type="text"
                    id="searchInput"
                    class="filter-input"
                    placeholder="Search guest or booking ID..."
                >

                <select
                    id="statusFilter"
                    class="filter-select"
                >
                    <option value="all">
                        All Booking Status
                    </option>

                    <option value="pending">
                        Pending
                    </option>

                    <option value="confirmed">
                        Confirmed
                    </option>

                    <option value="checked-in">
                        Checked-in
                    </option>

                    <option value="checked-out">
                        Checked-out
                    </option>

                    <option value="cancelled">
                        Cancelled
                    </option>
                </select>


                <select
                    id="paymentFilter"
                    class="filter-select"
                >
                    <option value="all">
                        All Payment Status
                    </option>

                    <option value="pending">
                        Payment Pending
                    </option>

                    <option value="paid">
                        Paid
                    </option>

                    <option value="failed">
                        Failed
                    </option>

                    <option value="refunded">
                        Refunded
                    </option>
                </select>

            </div>


            <!-- BOOKINGS -->

            <div
                id="bookingsContainer"
                class="bookings-container"
            >

                <div class="loading">
                    Loading bookings...
                </div>

            </div>

        </section>

    </main>

</div>


<script src="/admin-bookings.js"></script>

</body>
</html>
